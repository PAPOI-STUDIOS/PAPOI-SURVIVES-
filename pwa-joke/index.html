<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7c3aed" />
    <meta
      name="description"
      content="PWA de generador aleatorio de chistes con API externa."
    />
    <title>Joke Burst</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="card">
        <div class="status-row">
          <span class="badge">Random Jokes</span>
          <span id="statusText" class="status">Listo</span>
        </div>

        <h1>Joke Burst</h1>
        <p class="subtitle">Una risa nueva cada vez.</p>

        <div class="joke-box" aria-live="polite">
          <p id="jokeText">Toca el botón para cargar un chiste.</p>
        </div>

        <div class="controls">
          <button id="newJokeBtn" class="primary">Nuevo chiste</button>
          <button id="copyBtn" class="secondary" type="button">Copiar</button>
        </div>

        <button id="installBtn" class="install hidden" type="button">
          Instalar app
        </button>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
